<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIKYA - Road Telemetry Edge Node</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #111827;
            --border: #374151;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        header h1 { font-size: 1.15rem; color: var(--accent-cyan); font-weight: 800; }
        header p { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            background: #1f2937;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
        .dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* Real-Time Classifier Signal Badge */
        .classifier-card {
            background: #1f2937;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .classifier-tag {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag-normal { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .tag-pothole { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
        .tag-speedbump { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid var(--warning); }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-val { font-size: 1.5rem; font-weight: 800; font-family: monospace; color: #fff; }
        .metric-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-top: 4px; }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }
        canvas {
            width: 100%;
            height: 140px;
            background: #0b0f19;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.15s ease;
            text-align: center;
            text-decoration: none;
        }
        .btn-start { background: var(--accent-blue); color: #fff; }
        .btn-start.recording { background: var(--danger); }
        .btn-portal { background: var(--bg-card); border: 1px solid var(--border); color: var(--accent-cyan); font-size: 0.8rem; padding: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>AIKYA Sensor Node</h1>
        <p>Real-Time Road Roughness & Impact Telemetry</p>
        <div class="status-badge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Sensor Idle</span>
        </div>
    </header>

    <!-- Edge AI Dual-Phase Classifier -->
    <div class="classifier-card">
        <div style="font-size: 0.75rem; color: #cbd5e1; font-weight: 600;">
            Edge Feature Classifier:
        </div>
        <div class="classifier-tag tag-normal" id="classifierTag">Normal Road</div>
    </div>

    <div class="telemetry-grid">
        <div class="metric-card">
            <div class="metric-val" id="valZ" style="color: var(--accent-cyan);">0.00</div>
            <div class="metric-lbl">Vertical Accel (m/s²)</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valSpikes" style="color: var(--danger);">0</div>
            <div class="metric-lbl">Potholes Logged</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valSpeed">0.0</div>
            <div class="metric-lbl">Speed (km/h)</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valGPS" style="font-size: 0.85rem; padding-top: 6px;">--</div>
            <div class="metric-lbl">GPS Coordinates</div>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-header">
            <span>50Hz Accelerometer Waveform (Z-Axis)</span>
            <span style="color: var(--danger);">Threshold: 12.0 m/s²</span>
        </div>
        <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="controls">
        <button class="btn btn-start" id="btnToggle" onclick="toggleTelemetry()">🚀 Start Sensor Stream</button>
        <a href="/" class="btn btn-portal">🗺️ Return to PWD Dashboard</a>
    </div>

    <script>
        let isRunning = false;
        let deviceId = "NODE-" + Math.floor(1000 + Math.random() * 9000);
        let gpsLat = 12.8231, gpsLng = 80.0451, currentSpeed = 0.0;
        let zRawBuffer = [];
        let spikeCount = 0;
        let geoWatchId = null;
        let lastSignedZ = 0;

        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        let waveHistory = new Array(80).fill(0);

        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWaveform(newVal) {
            waveHistory.push(newVal);
            waveHistory.shift();

            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            ctx.clearRect(0, 0, w, h);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();

            ctx.strokeStyle = newVal > 12.0 ? "#ef4444" : "#38bdf8";
            ctx.lineWidth = 2;
            ctx.beginPath();
            const step = w / (waveHistory.length - 1);

            for (let i = 0; i < waveHistory.length; i++) {
                const normalized = (waveHistory[i] / 25.0) * (h / 2);
                const y = (h / 2) - normalized;
                if (i === 0) ctx.moveTo(0, y);
                else ctx.lineTo(i * step, y);
            }
            ctx.stroke();
        }

        async function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                const response = await DeviceMotionEvent.requestPermission();
                return response === 'granted';
            }
            return true;
        }

        async function toggleTelemetry() {
            if (!isRunning) {
                const granted = await requestMotionPermission();
                if (!granted) return alert("Motion sensor access denied.");

                window.addEventListener('devicemotion', handleMotion);
                startGPS();

                isRunning = true;
                document.getElementById('btnToggle').innerText = "🛑 Stop Telemetry Stream";
                document.getElementById('btnToggle').classList.add('recording');
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "Streaming 50Hz Data";
            } else {
                window.removeEventListener('devicemotion', handleMotion);
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

                isRunning = false;
                document.getElementById('btnToggle').innerText = "🚀 Start Sensor Stream";
                document.getElementById('btnToggle').classList.remove('recording');
                document.getElementById('statusDot').classList.remove('active');
                document.getElementById('statusText').innerText = "Sensor Idle";
            }
        }

        function handleMotion(event) {
            const acc = event.accelerationIncludingGravity || event.acceleration;
            if (!acc || acc.z === null) return;

            const signedZ = acc.z - 9.81; // Gravity detrended signed delta
            const zMag = Math.abs(signedZ);
            document.getElementById('valZ').innerText = zMag.toFixed(2);
            drawWaveform(zMag);

            // Real-Time Pothole vs Speed Bump Dual-Phase Classifier
            const tagEl = document.getElementById('classifierTag');
            if (zMag > 11.5) {
                if (signedZ < -3.0 || lastSignedZ < -2.5) {
                    // Negative dip followed by impact = Pothole Crater
                    tagEl.className = "classifier-tag tag-pothole";
                    tagEl.innerText = "CRATER / POTHOLE DETECTED";
                } else {
                    // Gradual elevation arc = Speed Breaker (Filtered)
                    tagEl.className = "classifier-tag tag-speedbump";
                    tagEl.innerText = "SPEED BUMP (FILTERED)";
                }
            } else {
                tagEl.className = "classifier-tag tag-normal";
                tagEl.innerText = "NORMAL ROAD";
            }

            lastSignedZ = signedZ;
            zRawBuffer.push(zMag);

            if (zRawBuffer.length >= 25) {
                sendTelemetryPayload([...zRawBuffer]);
                zRawBuffer = [];
            }
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                geoWatchId = navigator.geolocation.watchPosition((pos) => {
                    gpsLat = pos.coords.latitude;
                    gpsLng = pos.coords.longitude;
                    currentSpeed = pos.coords.speed ? (pos.coords.speed * 3.6) : 24.5;

                    document.getElementById('valSpeed').innerText = currentSpeed.toFixed(1);
                    document.getElementById('valGPS').innerText = `${gpsLat.toFixed(4)}, ${gpsLng.toFixed(4)}`;
                }, (err) => console.warn(err), { enableHighAccuracy: true });
            }
        }

        async function sendTelemetryPayload(buffer) {
            try {
                const res = await fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: deviceId,
                        lat: gpsLat,
                        lng: gpsLng,
                        speed_kmh: currentSpeed,
                        z_raw: buffer
                    })
                });
                const data = await res.json();
                if (data.is_spike) {
                    spikeCount++;
                    document.getElementById('valSpikes').innerText = spikeCount;
                }
            } catch (err) {
                console.error("Transmission error:", err);
            }
        }
    </script>
</body>
</html>
