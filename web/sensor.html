<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIKYA - Road Telemetry Edge Node</title>
    <style>
        :root {
            --bg-base: #060913;
            --bg-card: #0f172a;
            --border: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none;
            transition: background-color 0.2s ease;
        }

        header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        header h1 { font-size: 1.2rem; color: var(--accent-cyan); font-weight: 800; letter-spacing: 0.5px; }
        header p { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            background: #1e293b;
            border: 1px solid #334155;
            margin-top: 8px;
        }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
        .live-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* Dynamic Signal Classifier Card */
        .classifier-banner {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .classifier-tag {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .tag-normal { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.4); }
        .tag-pothole { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid var(--danger); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
        .tag-speedbump { background: rgba(245, 158, 11, 0.25); color: #fcd34d; border: 1px solid var(--warning); }

        /* Telemetry Metric Cards Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-val { font-size: 1.45rem; font-weight: 800; font-family: monospace; color: #fff; }
        .metric-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-top: 4px; }

        /* Live Canvas Waveform Container */
        .chart-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }
        canvas {
            width: 100%;
            height: 135px;
            background: #020617;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.15s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-stream { background: var(--accent-blue); color: #fff; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35); }
        .btn-stream.active { background: var(--danger); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35); }
        .btn-portal { background: #1e293b; border: 1px solid #334155; color: var(--accent-cyan); font-size: 0.8rem; padding: 10px; }
        .btn-portal:hover { background: #334155; }
    </style>
</head>
<body>

    <header>
        <h1>AIKYA Telemetry Edge Node</h1>
        <p>50Hz Vibration & Road Anomaly Classifier</p>
        <div class="status-pill">
            <span class="live-dot" id="statusDot"></span>
            <span id="statusText">Sensor Node Offline</span>
        </div>
    </header>

    <!-- Edge AI Feature Signal Tag -->
    <div class="classifier-banner">
        <div style="font-size: 0.75rem; color: #cbd5e1; font-weight: 600;">
            Dual-Phase Anomaly Filter:
        </div>
        <div class="classifier-tag tag-normal" id="classifierTag">Normal Road</div>
    </div>

    <div class="telemetry-grid">
        <div class="metric-card">
            <div class="metric-val" id="valZ" style="color: var(--accent-cyan);">0.00</div>
            <div class="metric-lbl">Dynamic Shock (m/s²)</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valSpikes" style="color: var(--danger);">0</div>
            <div class="metric-lbl">Potholes Logged</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valSpeed">0.0</div>
            <div class="metric-lbl">Speed (km/h)</div>
        </div>
        <div class="metric-card">
            <div class="metric-val" id="valGPS" style="font-size: 0.8rem; padding-top: 5px;">--</div>
            <div class="metric-lbl">GPS Geotag</div>
        </div>
    </div>

    <div class="chart-box">
        <div class="chart-header">
            <span>Real-Time Dynamic Waveform</span>
            <span style="color: var(--danger);">Spike Trigger: 13.5 m/s²</span>
        </div>
        <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="controls-group">
        <button class="btn btn-stream" id="btnToggle" onclick="toggleTelemetry()">🚀 Start Sensor Stream</button>
        <a href="/" class="btn btn-portal">🗺️ Return to PWD Dashboard</a>
    </div>

    <script>
        let isRunning = false;
        let deviceId = "NODE-" + Math.floor(1000 + Math.random() * 9000);
        let gpsLat = 12.8231, gpsLng = 80.0451, currentSpeed = 26.5;
        let zRawBuffer = [];
        let spikeCount = 0;
        let geoWatchId = null;
        let recentZ = [];
        
        let lastLoggedTime = 0;
        const HIT_COOLDOWN_MS = 2500; // 2.5s debounce to stop spamming
        const SHOCK_TRIGGER_THRESHOLD = 13.5; // Dynamic acceleration threshold in m/s^2

        // Dynamic 3-Axis Gravity Tracker
        let gx = 0, gy = 0, gz = 9.81;
        const alpha = 0.85;

        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        let waveHistory = new Array(90).fill(0);

        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawWaveform(newVal) {
            waveHistory.push(newVal);
            waveHistory.shift();

            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            ctx.clearRect(0, 0, w, h);

            // Center threshold guidelines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();

            // Render Dynamic Waveform
            ctx.strokeStyle = newVal >= SHOCK_TRIGGER_THRESHOLD ? "#ef4444" : "#38bdf8";
            ctx.lineWidth = newVal >= SHOCK_TRIGGER_THRESHOLD ? 2.5 : 1.8;
            ctx.beginPath();
            const step = w / (waveHistory.length - 1);

            for (let i = 0; i < waveHistory.length; i++) {
                const normalized = (waveHistory[i] / 24.0) * (h / 2);
                const y = (h / 2) - normalized;
                if (i === 0) ctx.moveTo(0, y);
                else ctx.lineTo(i * step, y);
            }
            ctx.stroke();
        }

        // iOS 13+ & Android Permission Handler
        async function requestMotionPermission() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    return permissionState === 'granted';
                } catch (err) {
                    console.warn("iOS Permission Error:", err);
                    return false;
                }
            }
            return true;
        }

        async function toggleTelemetry() {
            if (!isRunning) {
                const granted = await requestMotionPermission();
                if (!granted) {
                    alert("Please allow sensor access in browser permissions.");
                    return;
                }

                window.addEventListener('devicemotion', handleMotion, true);
                startGPS();

                isRunning = true;
                document.getElementById('btnToggle').innerText = "🛑 Stop Telemetry Stream";
                document.getElementById('btnToggle').classList.add('active');
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "Streaming at 50Hz (Active)";
            } else {
                window.removeEventListener('devicemotion', handleMotion, true);
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

                isRunning = false;
                document.getElementById('btnToggle').innerText = "🚀 Start Sensor Stream";
                document.getElementById('btnToggle').classList.remove('active');
                document.getElementById('statusDot').classList.remove('active');
                document.getElementById('statusText').innerText = "Sensor Node Offline";
                document.getElementById('classifierTag').className = "classifier-tag tag-normal";
                document.getElementById('classifierTag').innerText = "Normal Road";
            }
        }

        function handleMotion(event) {
            let acc = event.acceleration;
            let accG = event.accelerationIncludingGravity;
            let dynamicShock = 0;
            let signedZ = 0;

            // Step 1: Compute dynamic acceleration vector regardless of phone angle / OS
            if (acc && acc.x !== null && acc.y !== null && acc.z !== null && (Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z) > 0.02)) {
                // Hardware supports pure dynamic acceleration
                dynamicShock = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
                signedZ = acc.z;
            } else if (accG && accG.x !== null && accG.y !== null && accG.z !== null) {
                // iOS Safari fallback: Remove orientation gravity vector
                let rx = accG.x || 0;
                let ry = accG.y || 0;
                let rz = accG.z || 0;

                gx = alpha * gx + (1 - alpha) * rx;
                gy = alpha * gy + (1 - alpha) * ry;
                gz = alpha * gz + (1 - alpha) * rz;

                let dx = rx - gx;
                let dy = ry - gy;
                let dz = rz - gz;

                dynamicShock = Math.sqrt(dx * dx + dy * dy + dz * dz);
                signedZ = dz;
            }

            document.getElementById('valZ').innerText = dynamicShock.toFixed(2);
            drawWaveform(dynamicShock);

            // Sliding window analysis for Speed-bump vs Pothole
            recentZ.push(signedZ);
            if (recentZ.length > 8) recentZ.shift();

            const tagEl = document.getElementById('classifierTag');
            const now = Date.now();

            if (dynamicShock >= SHOCK_TRIGGER_THRESHOLD) {
                const hasNegativeDip = recentZ.some(val => val < -2.0);

                if (hasNegativeDip) {
                    tagEl.className = "classifier-tag tag-pothole";
                    tagEl.innerText = "CRATER IMPACT (LOGGED)";
                    if (navigator.vibrate) navigator.vibrate(100);
                } else {
                    tagEl.className = "classifier-tag tag-speedbump";
                    tagEl.innerText = "SPEED BUMP (FILTERED)";
                }

                // Trigger backend upload only once per cooldown period
                if (now - lastLoggedTime > HIT_COOLDOWN_MS) {
                    lastLoggedTime = now;
                    zRawBuffer.push(dynamicShock);
                    sendTelemetryPayload([...zRawBuffer]);
                    zRawBuffer = [];
                }
            } else {
                tagEl.className = "classifier-tag tag-normal";
                tagEl.innerText = "NORMAL ROAD";
            }
        }

        function startGPS() {
            if ("geolocation" in navigator) {
                geoWatchId = navigator.geolocation.watchPosition((pos) => {
                    gpsLat = pos.coords.latitude;
                    gpsLng = pos.coords.longitude;
                    currentSpeed = pos.coords.speed ? (pos.coords.speed * 3.6) : 28.4;

                    document.getElementById('valSpeed').innerText = currentSpeed.toFixed(1);
                    document.getElementById('valGPS').innerText = `${gpsLat.toFixed(4)}, ${gpsLng.toFixed(4)}`;
                }, (err) => {
                    // Indoor Fallback
                    gpsLat = 12.8231 + (Math.random() - 0.5) * 0.001;
                    gpsLng = 80.0451 + (Math.random() - 0.5) * 0.001;
                    document.getElementById('valGPS').innerText = `${gpsLat.toFixed(4)}, ${gpsLng.toFixed(4)} (Sim)`;
                }, { enableHighAccuracy: true, timeout: 5000 });
            }
        }

        async function sendTelemetryPayload(buffer) {
            try {
                const res = await fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: deviceId,
                        lat: gpsLat,
                        lng: gpsLng,
                        speed_kmh: currentSpeed,
                        z_raw: buffer.length > 0 ? buffer : [SHOCK_TRIGGER_THRESHOLD]
                    })
                });
                const data = await res.json();
                if (data.is_spike) {
                    spikeCount++;
                    document.getElementById('valSpikes').innerText = spikeCount;
                }
            } catch (err) {
                console.error("Telemetry error:", err);
            }
        }
    </script>
</body>
</html>
