<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIKYA - Citizen Road Grievance Portal</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #111827;
            --border: #374151;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.6);
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        header h1 { font-size: 1.2rem; color: var(--accent-cyan); font-weight: 800; }
        header p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            background: #1f2937;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            transition: 0.15s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-cyan);
        }

        /* Map Pin Picker */
        #miniMap {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 6px;
            z-index: 1;
        }

        .gps-status {
            font-size: 0.72rem;
            color: var(--accent-cyan);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Photo Upload Dropzone */
        .photo-box {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background: #1a2234;
            cursor: pointer;
            transition: 0.15s;
        }
        .photo-box:hover {
            border-color: var(--accent-cyan);
        }
        .photo-preview {
            max-width: 100%;
            max-height: 140px;
            border-radius: 6px;
            margin-top: 8px;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: #0369a1; }

        .btn-back {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.78rem;
            margin-top: 12px;
        }
        .btn-back:hover { color: #fff; }

        .success-banner {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: #6ee7b7;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📢 Citizen Grievance Portal</h1>
            <p>Report Road Hazards Directly to Municipal PWD</p>
        </header>

        <div class="success-banner" id="successBanner">
            ✅ Grievance Ticket logged successfully! Redirecting to PWD Command Center...
        </div>

        <form id="grievanceForm" onsubmit="submitGrievance(event)">
            <div class="form-group">
                <label>Defect Severity Estimate</label>
                <select id="severitySelect">
                    <option value="high">🔴 High Risk (Deep Crater / Wheel Damage Hazard)</option>
                    <option value="medium" selected>🟡 Medium Risk (Moderate Surface Depression)</option>
                    <option value="low">🔵 Low Risk (Surface Aggregate Loss / Minor)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Location (Auto-GPS / Drag Pin to Adjust)</label>
                <div id="miniMap"></div>
                <div class="gps-status" id="gpsStatus">📍 Acquiring high-precision GPS...</div>
            </div>

            <div class="form-group">
                <label>Attach On-Site Photo (Optional)</label>
                <div class="photo-box" onclick="document.getElementById('photoInput').click()">
                    <span id="uploadPrompt">📷 Tap to capture or upload photo</span>
                    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(event)">
                    <img id="imagePreview" class="photo-preview" alt="Preview">
                </div>
            </div>

            <div class="form-group">
                <label>Additional Landmark Details</label>
                <textarea id="notesInput" rows="2" placeholder="e.g. Near SRM Java Bus Stop, southbound lane"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">🚀 Submit Formal Grievance</button>
            <a href="/" class="btn-back">← Back to PWD Command Center</a>
        </form>
    </div>

    <script>
        let selectedLat = 12.8231;
        let selectedLng = 80.0451;

        // Initialize OpenTopoMap Mini-Picker
        const map = L.map('miniMap', { zoomControl: false }).setView([selectedLat, selectedLng], 16);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: '&copy; OpenTopoMap'
        }).addTo(map);

        // Draggable Defect Pin
        const marker = L.marker([selectedLat, selectedLng], { draggable: true }).addTo(map);

        marker.on('dragend', function (e) {
            const pos = marker.getLatLng();
            selectedLat = pos.lat;
            selectedLng = pos.lng;
            document.getElementById('gpsStatus').innerText = `📍 Pin set to: ${selectedLat.toFixed(5)}, ${selectedLng.toFixed(5)}`;
        });

        // Auto-locate citizen device
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                selectedLat = pos.coords.latitude;
                selectedLng = pos.coords.longitude;
                marker.setLatLng([selectedLat, selectedLng]);
                map.setView([selectedLat, selectedLng], 17);
                document.getElementById('gpsStatus').innerText = `📍 Locked: ${selectedLat.toFixed(5)}, ${selectedLng.toFixed(5)}`;
            }, err => {
                document.getElementById('gpsStatus').innerText = `📍 Defaulting to SRM Kattankulathur Sector (Drag pin to adjust)`;
            }, { enableHighAccuracy: true });
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('uploadPrompt').innerText = '📸 Photo Attached (Tap to change)';
                };
                reader.readAsDataURL(file);
            }
        }

        async function submitGrievance(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const severity = document.getElementById('severitySelect').value;
            const spikeValue = severity === 'high' ? 18.5 : (severity === 'medium' ? 14.0 : 10.5);

            try {
                // Post grievance as a verified ticket to backend
                const res = await fetch('/api/telemetry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: "CITIZEN-GRIEVANCE",
                        lat: selectedLat,
                        lng: selectedLng,
                        speed_kmh: 0,
                        z_raw: [spikeValue, spikeValue + 1.2, spikeValue - 0.8]
                    })
                });

                document.getElementById('successBanner').style.display = 'block';
                setTimeout(() => {
                    window.location.href = "/";
                }, 1600);
            } catch (err) {
                alert("Submission failed. Check network connection.");
                btn.innerText = "🚀 Submit Formal Grievance";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
