<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIKYA - PWD Central Road Defect Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #0284c7;
            --accent-cyan: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 800; color: var(--accent-cyan); }
        .brand p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }

        .actions-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-action {
            background: #1f2937;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: 0.2s ease;
        }
        .btn-action:hover { background: #374151; }
        .btn-action.btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn-action.btn-primary:hover { background: #0369a1; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            flex: 1;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .stat-card {
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-card .val { font-size: 1.25rem; font-weight: bold; margin-bottom: 2px; }
        .stat-card .lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }

        .ticket-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .ticket-card {
            background: #1f2937;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.15s;
        }
        .ticket-card:hover { border-color: var(--accent-cyan); background: #283548; }

        .ticket-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .ticket-id { font-size: 0.8rem; font-weight: bold; color: var(--accent-cyan); }
        .ticket-badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-high { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .badge-low { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
        .badge-resolved { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }

        .ticket-details { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }

        #map-container {
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        @media (max-width: 768px) {
            .dashboard-layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>AIKYA // PWD Command Portal</h1>
            <p>SRMIST Automated Road Defect & Telemetry System</p>
        </div>
        <div class="actions-bar">
            <a href="/report" class="btn-action btn-primary">📢 Report Pothole</a>
            <a href="/sensor" target="_blank" class="btn-action">📱 Sensor Node</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="val" id="count-critical" style="color: var(--danger);">0</div>
                    <div class="lbl">Critical</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="count-active" style="color: var(--warning);">0</div>
                    <div class="lbl">Active</div>
                </div>
                <div class="stat-card">
                    <div class="val" id="count-resolved" style="color: var(--success);">0</div>
                    <div class="lbl">Resolved</div>
                </div>
            </div>

            <div class="ticket-list" id="tickets-container">
                <!-- Defect list populated via API -->
            </div>
        </aside>

        <div id="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centered directly on SRMIST Kattankulathur
        const map = L.map('map-container').setView([12.8231, 80.0451], 16);

        L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        let markers = {};

        function getMarkerColor(p) {
            if (p.status === 'resolved') return '#10b981';
            if (p.severity === 'high') return '#ef4444';
            if (p.severity === 'medium') return '#f59e0b';
            return '#38bdf8';
        }

        async function fetchPotholes() {
            try {
                const res = await fetch('/api/potholes');
                const data = await res.json();
                renderData(data);
            } catch (err) {
                console.error("Error fetching defect data:", err);
            }
        }

        function renderData(potholes) {
            let critical = 0, active = 0, resolved = 0;
            const container = document.getElementById('tickets-container');
            container.innerHTML = '';

            potholes.forEach(p => {
                if (p.status === 'resolved') resolved++;
                else {
                    active++;
                    if (p.severity === 'high') critical++;
                }

                if (!markers[p.id]) {
                    const circle = L.circleMarker([p.lat, p.lng], {
                        radius: p.severity === 'high' ? 9 : 7,
                        fillColor: getMarkerColor(p),
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 0.9,
                        fillOpacity: 0.85
                    }).addTo(map);

                    circle.bindPopup(`
                        <div style="color: #111827; font-size: 0.8rem;">
                            <b>Ticket #${p.id}</b><br>
                            Severity: <b style="text-transform: uppercase;">${p.severity}</b><br>
                            Impact Hits: ${p.hit_count}<br>
                            Status: <b>${p.status}</b><br>
                            GPS: ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}
                        </div>
                    `);
                    markers[p.id] = circle;
                }

                const card = document.createElement('div');
                card.className = 'ticket-card';
                const badgeClass = p.status === 'resolved' ? 'badge-resolved' : `badge-${p.severity}`;
                
                card.innerHTML = `
                    <div class="ticket-head">
                        <span class="ticket-id">DEFECT #${p.id}</span>
                        <span class="ticket-badge ${badgeClass}">${p.status === 'resolved' ? 'RESOLVED' : p.severity}</span>
                    </div>
                    <div class="ticket-details">
                        📍 Lat: ${p.lat.toFixed(4)}, Lng: ${p.lng.toFixed(4)}<br>
                        📊 Impact Cluster: ${p.hit_count} hits detected
                    </div>
                `;

                card.onclick = () => {
                    map.flyTo([p.lat, p.lng], 17);
                    markers[p.id].openPopup();
                };

                container.appendChild(card);
            });

            document.getElementById('count-critical').innerText = critical;
            document.getElementById('count-active').innerText = active;
            document.getElementById('count-resolved').innerText = resolved;
        }

        fetchPotholes();
        setInterval(fetchPotholes, 5000);
    </script>
</body>
</html>
