<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIKYA - PWD Admin Console</title>
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: #0f172a;
            --border: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Login Modal Overlay */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.96);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 32px;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            text-align: center;
        }
        .login-card h2 { color: var(--accent-cyan); margin-bottom: 8px; font-size: 1.4rem; }
        .login-card p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .form-input {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            padding: 10px 12px;
            border-radius: 6px;
            color: #fff;
            margin-top: 5px;
            outline: none;
        }
        .btn-login {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Dashboard Top Bar */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .admin-title { font-size: 1.4rem; color: var(--accent-cyan); font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .admin-actions { display: flex; gap: 10px; }
        .btn-header {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
        }

        /* Table Grid */
        .table-wrap {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: left;
        }
        th {
            background: #1e293b;
            color: var(--text-muted);
            padding: 14px 16px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
            color: #e2e8f0;
        }
        tr:hover { background: #17233a; }

        .select-status {
            background: #020617;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            outline: none;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .badge-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid var(--danger); }
        .badge-medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid var(--warning); }
        .badge-low { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid var(--accent-cyan); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>🛡️ Admin Authentication</h2>
            <p>Enter municipal credentials to access the work order dispatch console.</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="adminUser" class="form-input" required autocomplete="username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPass" class="form-input" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Sign In to Command Center</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="admin-header">
            <div class="admin-title">
                🛡️ AIKYA PWD Admin Management Console
            </div>
            <div class="admin-actions">
                <a href="/" class="btn-header">🗺️ Public Map</a>
                <button class="btn-header" onclick="logoutAdmin()" style="background: #ef4444; border-color: #dc2626;">🚪 Sign Out</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Severity</th>
                        <th>Sensor Hits</th>
                        <th>Coordinates</th>
                        <th>Current Status</th>
                        <th>Admin Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem("aikya_admin_token");

        if (adminToken) {
            document.getElementById("loginOverlay").style.display = "none";
            loadAdminData();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("adminUser").value;
            const p = document.getElementById("adminPass").value;

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!res.ok) throw new Error("Invalid login");
                const data = await res.json();
                
                adminToken = data.token;
                localStorage.setItem("aikya_admin_token", adminToken);
                document.getElementById("loginOverlay").style.display = "none";
                loadAdminData();
            } catch (err) {
                alert("Authentication failed. Please verify credentials.");
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("aikya_admin_token");
            window.location.reload();
        }

        async function loadAdminData() {
            try {
                const res = await fetch("/api/potholes");
                const defects = await res.json();
                const tbody = document.getElementById("adminTableBody");
                tbody.innerHTML = "";

                defects.forEach(p => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><b>#PWD-${String(p.id).padStart(4, '0')}</b></td>
                        <td><span class="badge badge-${p.severity}">${p.severity}</span></td>
                        <td><b>${p.hit_count}</b> vehicles</td>
                        <td><code>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</code></td>
                        <td><b>${p.status.toUpperCase()}</b></td>
                        <td>
                            <select class="select-status" onchange="updateStatus(${p.id}, this.value)">
                                <option value="active" ${p.status === 'active' ? 'selected' : ''}>Active (Pending)</option>
                                <option value="in-progress" ${p.status === 'in-progress' ? 'selected' : ''}>In-Progress</option>
                                <option value="resolved" ${p.status === 'resolved' ? 'selected' : ''}>Resolved / Patched</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading admin table:", err);
            }
        }

        async function updateStatus(potholeId, newStatus) {
            try {
                const res = await fetch("/api/potholes/status", {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${adminToken}`
                    },
                    body: JSON.stringify({
                        pothole_id: potholeId,
                        status: newStatus
                    })
                });

                if (!res.ok) throw new Error("Failed to update status");
                loadAdminData();
            } catch (err) {
                alert("Failed to update ticket status. Check admin authorization.");
            }
        }
    </script>
</body>
</html>
